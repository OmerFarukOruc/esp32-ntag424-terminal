name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit==4.6.2
      # The gitleaks hook scans staged changes only, so nothing is staged in CI.
      # The gitleaks job below scans the full history instead.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  gitleaks:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the full history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose

  build:
    name: build (${{ matrix.config }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: default
            release: true
          - config: passive_buzzer
          - config: active_high
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
    env:
      CFG: ${{ matrix.config }}
      # ESP-IDF writes build/specs/picolibc.specs on every configure, and ccache hashes the mtime of a
      # -specs file unless it compares contents, so no object would come from the cache.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 250M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe sets the firmware version
      # The workspace is owned by another user than the container's.
      - name: Fetch the PN532 submodule
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.config }}-
      - name: Build the ${{ matrix.config }} configuration
        run: |
          . "$IDF_PATH/export.sh"
          export CCACHE_DIR="$PWD/.ccache"
          ccache --zero-stats
          if [ "$CFG" = default ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            idf.py -D "PROJECT_VER=$GITHUB_REF_NAME" build
          elif [ "$CFG" = default ]; then
            idf.py build
          else
            idf.py -B "build-$CFG" -D SDKCONFIG="build-$CFG/sdkconfig" \
              -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.$CFG" build
          fi
          ccache --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: .ccache
          key: ccache-${{ matrix.config }}-${{ github.run_id }}
      - name: Check that the build left dependencies.lock unchanged
        run: git diff --exit-code dependencies.lock
      # The firmware links the GPL-3.0 PN532 library, so the release carries the
      # complete source including the submodule, which GitHub's tag archive omits.
      - name: Package the release candidate
        if: matrix.release
        run: |
          . "$IDF_PATH/export.sh"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/package_release.py "$GITHUB_REF_NAME" build dist --expected-version "$GITHUB_REF_NAME"
          else
            python3 scripts/package_release.py "review-${GITHUB_SHA::7}" build dist
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.release
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.release
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release-rebuild:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      IDF_IMAGE: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Pull the ESP-IDF image
        run: docker pull "$IDF_IMAGE"
      - name: Rebuild the candidate from its source archive without network access
        run: |
          mkdir "$RUNNER_TEMP/release-check"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/dist:/dist:ro" -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP/release-check:/work" \
            "$IDF_IMAGE" bash -c '. "$IDF_PATH/export.sh" >/dev/null && python3 /scripts/check_release.py /dist /work/rebuild'
      - name: Show the end of the rebuild log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/release-check/rebuild/build.log" || true

  host-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the OpenSSL headers
        run: apt-get update && apt-get install -y --no-install-recommends libssl-dev
      # The BLE suite compiles the managed cJSON component that dependencies.lock pins.
      - name: Resolve the managed components
        run: . "$IDF_PATH/export.sh" && idf.py reconfigure
      - name: Check that the reconfigure left dependencies.lock unchanged
        run: git diff --exit-code dependencies.lock
      - name: Run the host suites
        run: . "$IDF_PATH/export.sh" && test/host/run.sh
      - name: Check the README verifier
        run: . "$IDF_PATH/export.sh" && python test/host/test_readme_verifier.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pre-commit, gitleaks, build, release-rebuild, host-tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
